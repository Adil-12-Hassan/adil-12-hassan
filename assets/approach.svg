<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="126" viewBox="0 0 1200 126" fill="none">
  <style>
    .dash { stroke-dasharray: 8 10; animation: march 8s linear infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: pop 2s ease-in-out infinite alternate; }
