  <circle cx="444" cy="64" r="7" fill="#f3c969" class="node" />
  <circle cx="756" cy="64" r="7" fill="#87c6df" class="node" />
  <circle cx="1068" cy="64" r="7" fill="#ccff66" class="node" />
