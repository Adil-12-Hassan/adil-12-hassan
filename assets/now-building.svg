    @keyframes move { to { stroke-dashoffset: -78; } }
  </style>
  <rect x="1" y="1" width="558" height="206" rx="12" fill="#241d28" stroke="#594052" />
  <text x="31" y="49" fill="#f3a7be" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">ON THE DESK RIGHT NOW</text>
  <text x="28" y="94" fill="#f6edf2" font-family="Arial, sans-serif" font-size="30" font-weight="700">NIGHTWATCH</text>
  <text x="31" y="122" fill="#cdbbc6" font-family="Arial, sans-serif" font-size="14">React · TypeScript · Node · MongoDB</text>
  <path class="wave" d="M31 160H517" stroke="#73586c" stroke-width="2" />
  <circle class="beat" cx="47" cy="160" r="5" fill="#ff8066" />
  <text x="31" y="188" fill="#ccff66" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">IN ACTIVE DEVELOPMENT</text>
