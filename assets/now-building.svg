<svg xmlns="http://www.w3.org/2000/svg" width="560" height="208" viewBox="0 0 560 208" fill="none">
  <style>
    .beat { animation: beat 1.7s ease-in-out infinite; transform-origin: 47px 43px; }
    .wave { stroke-dasharray: 5 8; animation: move 5s linear infinite; }
